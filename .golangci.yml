run:
  timeout: 10m

linters:
  disable-all: true
  enable:
    - gofmt
    - ineffassign
    - forbidigo
    - errcheck

linters-settings:
  forbidigo:
    forbid:
      - p: '^fmt\.Print(f|ln)?$'
        msg: use the structured logger (pkg/logger or zerolog) instead
      - p: '^log\.Print(f|ln)?$'
        msg: use the structured logger (pkg/logger or zerolog) instead
      - p: '^print(ln)?$'
        msg: use the structured logger (pkg/logger or zerolog) instead
      - p: '^(money\.)?Must(FromString|FromFloat64)$'
        msg: 'money.Must* panicking constructors are forbidden in request paths; use money.FromString or money.FromFloat64 and return error'

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - forbidigo
    - path: pkg/money/
      linters:
        - forbidigo
    - path: cmd/seed/
      linters:
        - forbidigo
    - path: cmd/migrate/
      linters:
        - forbidigo
    - path: cmd/config-validate/
      linters:
        - forbidigo
    - path: cmd/indexer/
      linters:
        - forbidigo
    - path: tests/performance/seed/
      linters:
        - forbidigo
    # errcheck is rolled out package by package; cmd/indexer, cmd/migrate,
    # internal/domain/circle, internal/domain/yellowcard, internal/api/handler,
    # internal/api/middleware, internal/websocket, pkg/stellar, pkg/rabbitmq,
    # and webhook are clean and must stay that way. Extend this pattern as
    # other packages are fixed.
    - path-except: ^(cmd/indexer/|cmd/migrate/|internal/domain/circle/|internal/domain/yellowcard/|internal/api/handler/|internal/api/middleware/|internal/websocket/|pkg/stellar/|webhook/|pkg/rabbitmq/)
      linters:
        - errcheck
