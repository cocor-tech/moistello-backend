linters:
  disable-all: true
  enable:
    - gofmt
    - ineffassign
    - forbidigo

linters-settings:
  forbidigo:
    forbid:
      - p: '^fmt\.Print(f|ln)?$'
        msg: use the structured logger (pkg/logger or zerolog) instead
      - p: '^log\.Print(f|ln)?$'
        msg: use the structured logger (pkg/logger or zerolog) instead
      - p: '^print(ln)?$'
        msg: use the structured logger (pkg/logger or zerolog) instead

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - forbidigo
